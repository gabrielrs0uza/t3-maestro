# OpenSSF Scorecard: avalia as práticas de segurança do repositório, publica a
# nota na API pública do Scorecard (é dela que sai o selo do README) e guarda o
# SARIF no artefato do workflow e em Security → Code scanning.
#
# Com publish_results: true, o Scorecard exige que este arquivo siga as
# restrições dele: sem env nem defaults no topo, sem permissão de escrita no
# topo, id-token: write só neste job, runner do GitHub com Ubuntu, sem container
# nem services e só as actions usadas abaixo, sem passo "run". A publicação só
# vale no ramo padrão; o "if" do job impede rodar em outro ramo.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analise:
    name: Scorecard
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Para enviar o SARIF para Security → Code scanning.
      security-events: write
      # Para publicar o resultado na API do Scorecard, que gera o selo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Roda o Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Guarda o SARIF como artefato
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 5

      - name: Envia o SARIF para Code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
