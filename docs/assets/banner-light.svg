<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" xml:lang="en" aria-labelledby="title desc">
  <title id="title">T3 Maestro</title>
  <desc id="desc">Talk to one chat and it conducts the rest: five lines run from the tip of a baton, like a musical staff, and the notes on them are the other chats.</desc>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <text x="72" y="118" fill="#59636e" font-size="15" font-weight="600" letter-spacing="2.4">RULES FOR T3 CODE</text>
    <text x="70" y="180" fill="#1f2328" font-size="64" font-weight="650" letter-spacing="-1.2">T3 Maestro</text>
    <text x="72" y="226" fill="#59636e" font-size="25">Talk to one chat. It conducts the rest.</text>
  </g>
  <g fill="none" stroke="#afb8c1" stroke-width="1.6" stroke-linecap="round">
    <path d="M732 160 C800 160 820 104 900 104 L1208 104"/>
    <path d="M732 160 C800 160 830 132 900 132 L1208 132"/>
    <path d="M732 160 L1208 160"/>
    <path d="M732 160 C800 160 830 188 900 188 L1208 188"/>
    <path d="M732 160 C800 160 820 216 900 216 L1208 216"/>
  </g>
  <line x1="682" y1="210" x2="726" y2="166" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/>
  <circle cx="732" cy="160" r="15" fill="#8250df" opacity="0.16"/>
  <circle cx="732" cy="160" r="6.5" fill="#8250df"/>
  <g fill="#1f2328">
    <circle cx="958" cy="132" r="6"/>
    <circle cx="1012" cy="188" r="6"/>
    <circle cx="1066" cy="104" r="6"/>
    <circle cx="1166" cy="216" r="6"/>
    <circle cx="1188" cy="132" r="6"/>
  </g>
  <circle cx="1114" cy="160" r="6.5" fill="#8250df"/>
</svg>
